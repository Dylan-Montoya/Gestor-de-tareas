<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de Tareas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="todo-container">
    <header>
      <h1>Mis Tareas</h1>
    </header>

    <form id="todo-form" class="todo-form">
      <input 
        type="text" 
        id="todo-input" 
        placeholder="Escribe una nueva tarea..." 
        required 
        autocomplete="off"
      >
      <button type="submit" id="add-btn">Agregar</button>
    </form>

    <div class="filter-controls">
      <button class="filter-btn active" data-filter="all">Todas</button>
      <button class="filter-btn" data-filter="pending">Pendientes</button>
      <button class="filter-btn" data-filter="completed">Completadas</button>
    </div>

    <ul id="todo-list" class="todo-list"></ul>

    <footer class="todo-footer">
      <span id="items-left">0 tareas pendientes</span>
      <button id="clear-completed" class="clear-btn">Limpiar completadas</button>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
